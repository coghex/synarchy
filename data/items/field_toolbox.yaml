items:
  # Starting expedition equipment carried by the technomule (#1855), not
  # ruin loot. This is an inspectable item-container, not player-managed
  # storage: its authored contents materialize with each fresh instance,
  # but it deliberately has no storage-capacity block.
  - name: "field_toolbox"
    display_name: "Field Toolbox"
    sprite: "assets/textures/items/tool/toolbox.png"
    weight: 1.2       # empty steel case; contents contribute recursively
    bulk: 6.0         # litres of external bulk
    kind: container
    category: Tools
    make: factory
    material: steel
    # 0.50 + 0.80 + 0.10 = 1.40 kg of tools, so a loaded box masses
    # 2.60 kg recursively (Item.Types.itemTotalWeight).
    contents:
      - { item: crescent_wrench,      count: 1 }
      - { item: hammer,               count: 1 }
      - { item: phillips_screwdriver, count: 1 }
