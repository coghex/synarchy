# tiller — minimal runtime unit declaration (issue #1261, TEX-6).
#
# Promoted from #1257's inventory-only `asset_units:` form to a real
# `units:` entry by the owner decision of 2026-08-11, which preserved all
# three YAML-less trees rather than dropping them as preview targets.
# `Engine.Asset.YamlUnits.loadUnitYaml` now returns this def, so it is
# registered, textured, and listable like any other unit.
#
# It is deliberately MINIMAL: a name, one direct sprite, and the animation
# inventory this tree already carried. No gameplay role, state mappings,
# body, combat design, or new art — every one of those is a separate
# decision this slice does not take.
#
# `sprite:` reuses this tree's own idle south frame. Reusing an
# animation frame as a direct sprite is deliberately legal (#1257) and
# is what `technomule.yaml` already does: it loads ONCE, as a single
# direct texture, and is never registered again as an animation frame.
#
# The animation entries below are #1257's, unchanged: they are the
# authority `tools/pack_atlas.py` compiles this tree's atlases from, and
# since TEX-6 retired per-frame unit-animation loading they are also the
# only reason its animations render at all — in gameplay and in
# `--preview units/tiller` alike.
units:
  - name: tiller
    sprite: "assets/textures/units/tiller/animations/idle/south/frame_000.png"
    animations:
      idle:
        fps: 8
        loop: true
        flip: true
        frames:
          south:
            - "assets/textures/units/tiller/animations/idle/south/frame_000.png"
          south-east:
            - "assets/textures/units/tiller/animations/idle/south-east/frame_000.png"
          east:
            - "assets/textures/units/tiller/animations/idle/east/frame_000.png"
          north-east:
            - "assets/textures/units/tiller/animations/idle/north-east/frame_000.png"
          north:
            - "assets/textures/units/tiller/animations/idle/north/frame_000.png"
      run:
        fps: 8
        loop: true
        flip: true
        frames:
          south:
            - "assets/textures/units/tiller/animations/run/south/frame_000.png"
            - "assets/textures/units/tiller/animations/run/south/frame_001.png"
            - "assets/textures/units/tiller/animations/run/south/frame_002.png"
            - "assets/textures/units/tiller/animations/run/south/frame_003.png"
            - "assets/textures/units/tiller/animations/run/south/frame_004.png"
          south-east:
            - "assets/textures/units/tiller/animations/run/south-east/frame_000.png"
            - "assets/textures/units/tiller/animations/run/south-east/frame_001.png"
            - "assets/textures/units/tiller/animations/run/south-east/frame_002.png"
            - "assets/textures/units/tiller/animations/run/south-east/frame_003.png"
            - "assets/textures/units/tiller/animations/run/south-east/frame_004.png"
          east:
            - "assets/textures/units/tiller/animations/run/east/frame_000.png"
            - "assets/textures/units/tiller/animations/run/east/frame_001.png"
            - "assets/textures/units/tiller/animations/run/east/frame_002.png"
            - "assets/textures/units/tiller/animations/run/east/frame_003.png"
            - "assets/textures/units/tiller/animations/run/east/frame_004.png"
          north-east:
            - "assets/textures/units/tiller/animations/run/north-east/frame_000.png"
            - "assets/textures/units/tiller/animations/run/north-east/frame_001.png"
            - "assets/textures/units/tiller/animations/run/north-east/frame_002.png"
            - "assets/textures/units/tiller/animations/run/north-east/frame_003.png"
            - "assets/textures/units/tiller/animations/run/north-east/frame_004.png"
          north:
            - "assets/textures/units/tiller/animations/run/north/frame_000.png"
            - "assets/textures/units/tiller/animations/run/north/frame_001.png"
            - "assets/textures/units/tiller/animations/run/north/frame_002.png"
            - "assets/textures/units/tiller/animations/run/north/frame_003.png"
            - "assets/textures/units/tiller/animations/run/north/frame_004.png"
