# Location definitions: premade structures stamped into the world.
#
# Loaded at boot by engine.loadLocationYaml (after items / units /
# buildings — locations load LAST so their content ids can be resolved
# against the other registries later, in #90). Each entry registers a
# LocationDef; the `builder` names a Lua function in scripts/locations.lua
# that authors the geometry when the location is stamped.
#
# `contents` ids are resolved at spawn time (#90), not here — an unknown
# id logs a warning and is skipped rather than crashing. A content
# `kind`, by contrast, is checked HERE at load: the vocabulary is closed
# to unit / item / loot_table / building (#1708), and anything else
# fails this whole file's load rather than registering and warning later.
#
# ONE content id is checked at load too: a `significant: true` item
# (#917). It must already be in the item registry — hence "after items"
# above being load-bearing rather than incidental — because an
# obligation that can never spawn leaves the location permanently
# unclearable, which a spawn-time warning could not recover from.
locations:
  - id: ruin_small
    label: "Small Ruin"
    type: ruin
    # Lua builder (scripts/locations.lua `builders.room_small_damaged`,
    # #91): a partially-collapsed 5x5 RCT-style room — damaged-variant
    # floor / posts / walls, a walkable breach in the perimeter, one
    # corner post gone, no ceiling.
    builder: room_small_damaged
    # Terrain placement constraint tags read by the world-gen overlay
    # (#89) to filter candidate chunks. The room wants flat ground.
    anchor: [flat]
    # Authoritative spatial contract (#777): an inclusive, axis-aligned
    # tile box relative to the anchor. This IS the 5x5 footprint — the
    # builder (room_small_damaged) and the content scatter below both
    # derive their geometry from these bounds; there is no separate
    # Lua-side radius constant to keep in sync. Since #1230 this is also
    # the reveal footprint: a player-owned unit discovers the ruin when
    # its line of sight touches any tile of this box.
    bounds: { min_x: -2, min_y: -2, max_x: 2, max_y: 2 }
    # Naming scheme (#1101). Each placed instance is named in its
    # world's own generated language (epic #708) as one
    # modifier + head compound drawn deterministically from these two
    # pools by the instance's stable id. The ids are #709 concept ids
    # from data/language/concepts.yaml — heads need a `singular` form,
    # modifiers a `modifier` form — and every one of them is validated
    # when this file loads: an unknown id or a missing form rejects the
    # whole file rather than silently falling back to `label` (which is
    # what a world with NO language legitimately uses).
    #
    # Which concepts a location may draw on is DATA, deliberately: the
    # engine has no mapping from `type: ruin` to a concept set, so a new
    # location kind is authored here rather than coded. These are the
    # abandoned-structure readings of the catalogue's place-domain heads,
    # with modifiers spanning ruin, decay, and the elements that outlast
    # a building.
    naming:
      heads: [KEEP, TOWER, HAVEN, SANCTUARY, GATE, THRESHOLD, HOLLOW,
              CAVERN, HEARTH, WALL, SPIRE, THRONE]
      modifiers: [ASH, STONE, IRON, SAND, RUIN, SILENCE, SORROW, FROST,
                  SHADOW, HOLLOW, BONE, OATH]
    # This location TYPE's zoom-map annotation texture (#781, singular
    # since #1230). It is what the marker becomes once a player-owned
    # unit has SEEN the ruin, and — darkened through the icon quad's own
    # colour, not a second bitmap — once the ruin is cleared or
    # depleted. Before that every annotated location draws the ONE
    # shared assets/textures/icons/location/location_unknown.png, which
    # no definition declares (Location.Types.locationUnknownIconPath):
    # the zoom map must not leak WHAT is there before anyone has looked.
    map_icon: "assets/textures/icons/location/ruin.png"
    # World-gen overlay (#89) placement controls. Per-type, not global:
    # at most `max_count` instances, each at least `min_spacing` chunks
    # from another ruin (jittered, deterministic from the seed). Both are
    # optional (defaults: max_count 4, min_spacing 4).
    max_count: 6
    min_spacing: 5
    # Content spawned once, the first time this location's chunk loads
    # (#90). Fixed-position entries land at that exact anchor offset;
    # entries without `position` scatter randomly within the room.
    # `count` (how many instances to place) and `rolls` (how many loot
    # draws to perform) are both optional and both default to 1. Each
    # must be an integer >= 1 when written out: zero and negative values
    # are rejected when this file loads (#1721), because they would
    # spawn nothing while still burning the location's exactly-once
    # content lifecycle. There is no disable-by-zero — delete or comment
    # out an entry you do not want.
    # A scavenge scene (#91): 2 rolls of common ruin loot, scattered
    # where the occupants left them, plus #916's one-time uniform roll
    # of 0–3 primitive nomads. `count_range` is intentionally distinct
    # from positive `count`: zero is a real cleared-encounter outcome.
    #
    # #921 governs the INCIDENTAL half: what a ruin's salvage is worth
    # is a draw, not a promise, and it stays that way — the two
    # `ruin_common` rolls below guarantee nothing in particular. (The
    # radio and canteen that used to sit here are spawn-only starting
    # equipment, data/units/acolyte.yaml; they are deliberately absent
    # from ruin_common too.) Which items a particular ruin yields is
    # seed-stable and rolled exactly once per instance (#948).
    #
    # #917 adds the other half: ONE guaranteed significant item, which
    # is a promise, and which the ruin's cleared state waits on. A ruin
    # is cleared only when its authored encounter is satisfied AND every
    # significant item it spawned has been taken — so a zero-nomad ruin
    # stays uncleared until someone actually carries the processing unit
    # out. `significant` is legal only on a fixed `kind: item` entry
    # (the loader rejects it anywhere else): a loot-table draw must
    # never decide what a location owes.
    #
    # ORDER IS LOAD-BEARING. The `ruin_common` entry keeps authored
    # index 1 with its two rolls, and the significant entry is APPENDED
    # after the existing contents, because #948 keys each incidental
    # draw on the entry's positional index — reordering these lines
    # would silently change what every already-generated ruin in every
    # existing world rolls.
    #
    # The reward is `processing_unit`: pre-collapse fabrication salvage
    # that `make: factory` puts permanently out of the colony's own
    # reach (data/items/processing_unit.yaml), so it is worth the trip
    # and cannot be crafted instead of fetched. Deliberately not
    # `radio`, which D-6 in docs/expedition_gameplay_loop.md reserves
    # for unit communication.
    contents:
      - { kind: loot_table, id: ruin_common, rolls: 2 }
      - { kind: unit, id: nomad_primitive, faction: hostile,
          count_range: { min: 0, max: 3 }, clearance: death_only }
      - { kind: item, id: processing_unit, significant: true }
