# Publishes ghcr.io/coghex/synarchy-deps (#2864): Ubuntu 24.04, the CI
# image's apt build dependencies, GHC/cabal at the CI image's prefixes,
# the Hackage index snapshot and the compiled Cabal store for master's
# dependency plan, so machines outside GitHub Actions (cloud coding
# sandboxes, fresh development machines) skip the ~17-minute dependency
# build. Consumers: docs/deps_image.md. Recipe: .github/deps/Dockerfile.
# Logic and its tests: tools/ci_deps_image.py, tools/test_ci_deps_image.py.
#
# Deliberately a workflow of its own rather than jobs in ci.yml:
#   * It triggers ONLY on pushes to master, so a pull request -- fork or
#     same-repository -- never even starts it. (ci-image.yml publishes
#     from same-repository PRs; this image must not.) Both job conditions
#     and the tool itself refuse any other event as well.
#   * It is not a gate. Nothing waits on it, and it never touches the CI
#     image, the Actions caches or their keys. Its job-level lock below
#     cannot cancel or queue anything in the CI workflow's runs.
#   * It is built natively on Ubuntu 24.04 (ubuntu-24.04 runner, FROM the
#     ubuntu:24.04 digest it resolves), not in the 22.04 CI image: Cabal's
#     unit IDs hash the system pkg-config versions of vulkan and zlib, so
#     only a 24.04-built store is reused in full on the 24.04 sandboxes.
#
# Two jobs, because the lock must be keyed on the identity and the
# identity exists only once the plan is resolved:
#   deps-plan   resolves the plan inside the image recipe's own toolchain
#               stage at a fixed workspace and prints its identity tag
#               `ubuntu24.04-x86_64-ghc9.12.2-<sha256 of plan.json>`.
#               Skipped work on a docs-only push (tools/ci_docs_fast_path.py),
#               which cannot change the plan.
#   deps-image  serialized per identity; publishes the immutable tag at
#               most once (confirmed absence only, re-checked right before
#               the push), moves `master` when this commit is still master's
#               current plan, and proves both tags are readable without
#               credentials. An unchanged identity costs the plan job and a
#               registry check, never a rebuild.
#
# A job waiting on the lock is cancelled only if an even newer run of the
# SAME identity queues behind it (GitHub keeps one pending job per group);
# that newer run then does the same work, so nothing is lost but the
# cancelled job's own line in this workflow's history.
name: Dependency image

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  deps-plan:
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && github.repository == 'coghex/synarchy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      base_image: ${{ steps.plan.outputs.base_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The same selector, over the same complete pushed span, that decides
      # ci.yml's docs-only fast path. A docs-only change cannot move the
      # plan; it fails closed (runs) when the range is unresolvable.
      - name: Select docs-only fast path
        id: docs-fast-path
        run: |
          DOCS_ONLY=false
          BASE='${{ github.event.before }}'
          ZERO=0000000000000000000000000000000000000000
          if [ -n "$BASE" ] && [ "$BASE" != "$ZERO" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --no-renames --name-status "$BASE" '${{ github.sha }}' > /tmp/deps-change-range.txt
            DOCS_ONLY="$(python3 tools/ci_docs_fast_path.py --stdin --explain < /tmp/deps-change-range.txt)"
          fi
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "docs-only fast path: $DOCS_ONLY"

      - name: Resolve the Ubuntu 24.04 dependency plan
        id: plan
        if: steps.docs-fast-path.outputs.docs_only != 'true'
        run: >-
          python3 tools/ci_deps_image.py plan
          --base-image ubuntu:24.04
          --github-output "$GITHUB_OUTPUT"

  deps-image:
    needs: deps-plan
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && github.repository == 'coghex/synarchy'
      && needs.deps-plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # One run per identity at a time (ci-image.yml's write-once pattern):
    # two runs that resolved the same unpublished plan cannot both build
    # and push it. Different identities never wait on each other.
    concurrency:
      group: synarchy-deps-${{ needs.deps-plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      # Full history: the moving-tag rule compares this commit with
      # master's tip at the moment of the update.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish or reuse the dependency image
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 tools/ci_deps_image.py publish
          --tag '${{ needs.deps-plan.outputs.tag }}'
          --plan-sha256 '${{ needs.deps-plan.outputs.plan_sha256 }}'
          --base-image '${{ needs.deps-plan.outputs.base_image }}'
          --event '${{ github.event_name }}'
          --ref '${{ github.ref }}'
          --repository '${{ github.repository }}'
          --sha '${{ github.sha }}'
          --build-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          --github-summary "$GITHUB_STEP_SUMMARY"
