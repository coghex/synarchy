# Publishes ghcr.io/coghex/synarchy-deps (#2864): Ubuntu 24.04, the CI
# image's apt build dependencies, GHC/cabal at the CI image's prefixes,
# the Hackage index snapshot and the compiled Cabal store for master's
# dependency plan, so machines outside GitHub Actions (cloud coding
# sandboxes, fresh development machines) skip the ~17-minute dependency
# build. Consumers: docs/deps_image.md. Recipe: .github/deps/Dockerfile.
# Logic and its tests: tools/ci_deps_image.py, tools/test_ci_deps_image.py.
#
# Deliberately a workflow of its own rather than jobs in ci.yml:
#   * It triggers ONLY on pushes to master, so a pull request -- fork or
#     same-repository -- never even starts it. (ci-image.yml publishes
#     from same-repository PRs; this image must not.) Both job conditions
#     and the tool itself refuse any other event as well.
#   * It is not a gate. Nothing waits on it, and it never touches the CI
#     image, the Actions caches or their keys. Its job-level lock below
#     cannot cancel or queue anything in the CI workflow's runs.
#   * It is built natively on Ubuntu 24.04 (ubuntu-24.04 runner, FROM the
#     ubuntu:24.04 digest it resolves), not in the 26.04 CI image: Cabal's
#     unit IDs hash the system pkg-config versions of vulkan and zlib, so
#     only a 24.04-built store is reused in full on the 24.04 sandboxes.
#
# Three jobs, because each lock needs its own key:
#   deps-plan   resolves the plan inside the image recipe's own toolchain
#               stage at a fixed workspace and prints its identity tag
#               `ubuntu24.04-x86_64-ghc9.12.2-<sha256 of plan.json>`.
#               Skipped work on a docs-only push (tools/ci_docs_fast_path.py),
#               which cannot change the plan.
#   deps-image  serialized PER IDENTITY; publishes the immutable tag at
#               most once (confirmed absence only, re-checked right before
#               the push) and proves it readable without credentials. An
#               unchanged identity costs the plan job and a registry check,
#               never a rebuild. It never touches `master`.
#   deps-master serialized across ALL identities by one fixed group; the
#               only writer of `master`. Under that lock it decides which
#               identity master's TIP needs (this run's, when no plan input
#               changed since this commit; otherwise the tip's own plan,
#               resolved here) and writes it, so no other run's decision can
#               go stale between its check and its write. (Per-identity
#               groups alone let an older run check, a newer run move
#               `master`, and the older run then overwrite it.)
#
# GitHub keeps one PENDING job per concurrency group and cancels an older
# pending one when another queues. In deps-image that is a run of the same
# identity, which then does the same work. In deps-master the job that
# replaces it runs later and, like every reconcile, targets master's tip
# as it is then, not its own commit, so the cancelled job's update is not
# lost: the tip's identity is published before that commit's reconcile
# queues, so any reconcile that runs after it reaches the same target.
# Only the cancelled job's own line in this workflow's history is lost.
name: Dependency image

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  deps-plan:
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && github.repository == 'coghex/synarchy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      base_image: ${{ steps.plan.outputs.base_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The same selector, over the same complete pushed span, that decides
      # ci.yml's docs-only fast path. A docs-only change cannot move the
      # plan; it fails closed (runs) when the range is unresolvable.
      - name: Select docs-only fast path
        id: docs-fast-path
        run: |
          DOCS_ONLY=false
          BASE='${{ github.event.before }}'
          ZERO=0000000000000000000000000000000000000000
          if [ -n "$BASE" ] && [ "$BASE" != "$ZERO" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --no-renames --name-status "$BASE" '${{ github.sha }}' > /tmp/deps-change-range.txt
            DOCS_ONLY="$(python3 tools/ci_docs_fast_path.py --stdin --explain < /tmp/deps-change-range.txt)"
          fi
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "docs-only fast path: $DOCS_ONLY"

      - name: Resolve the Ubuntu 24.04 dependency plan
        id: plan
        if: steps.docs-fast-path.outputs.docs_only != 'true'
        run: >-
          python3 tools/ci_deps_image.py plan
          --base-image ubuntu:24.04
          --github-output "$GITHUB_OUTPUT"

  deps-image:
    needs: deps-plan
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && github.repository == 'coghex/synarchy'
      && needs.deps-plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # One run per identity at a time (ci-image.yml's write-once pattern):
    # two runs that resolved the same unpublished plan cannot both build
    # and push it. Different identities never wait on each other.
    concurrency:
      group: synarchy-deps-${{ needs.deps-plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish or reuse the dependency image
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 tools/ci_deps_image.py publish
          --tag '${{ needs.deps-plan.outputs.tag }}'
          --plan-sha256 '${{ needs.deps-plan.outputs.plan_sha256 }}'
          --base-image '${{ needs.deps-plan.outputs.base_image }}'
          --event '${{ github.event_name }}'
          --ref '${{ github.ref }}'
          --repository '${{ github.repository }}'
          --sha '${{ github.sha }}'
          --build-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          --github-summary "$GITHUB_STEP_SUMMARY"

  deps-master:
    needs: [deps-plan, deps-image]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && github.repository == 'coghex/synarchy'
      && needs.deps-plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # ONE group for every identity (see the header): every decision about
    # `master` and its write happen inside it. Never keyed on the identity.
    concurrency:
      group: synarchy-deps-master
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      # Full history: the decision compares this commit with master's tip,
      # and resolving the tip's plan checks out a worktree of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Point master at master's current dependency image
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 tools/ci_deps_image.py reconcile-master
          --tag '${{ needs.deps-plan.outputs.tag }}'
          --base-image '${{ needs.deps-plan.outputs.base_image }}'
          --event '${{ github.event_name }}'
          --ref '${{ github.ref }}'
          --repository '${{ github.repository }}'
          --sha '${{ github.sha }}'
          --github-summary "$GITHUB_STEP_SUMMARY"
