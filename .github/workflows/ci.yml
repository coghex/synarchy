      # gate can make; the companion boots nothing and runs in well
      # under a second.
      # test_probe_root_cleanup is #1791's: the staging half of the
      # isolated-root contract `tools/foraging_probe.py`,
      # `tools/flora_growth_probe.py`, `tools/farm_ai_probe.py` and
