      # make; the companion boots nothing and runs in well under a
      # second.
      # test_location_probe_config_isolation is #1729's: the private
      # `config/` tree `tools/location_content_probe.py`,
      # `tools/location_overlay_probe.py` and
      # `tools/location_stamp_idempotent_probe.py` each stage, and that
