# CI gate (#436): build everything warning-free and run the headless
# test tiers on Linux — the first automated validation of the Linux
# build (development is on macOS).
#
# Coverage vs CLAUDE.md testing tiers:
#   - tier 2 hspec:   cabal test synarchy-test-headless
#   - tier 2 audit:   python3 tools/test_audit.py
#   - tier 2 worldgen: tools/world_check.py --quick, a blocking gate for
#     worldgen-output PRs and every post-merge master push.
#   - tier 3 full:    the same worldgen selection additionally sets
#     SYNARCHY_FULL_TESTS=1 on the hspec step (#1364), so the full-tier
#     examples run and block on exactly the runs world_check --quick
#     does. See that step for why it is not a conditional `env:`.
#     Worldgen float math proved bit-stable across architectures on the
#     first run (6/6 exact-match against the macOS/aarch64-captured
#     baselines from #421, PR #449) — if it ever flakes cross-arch,
#     demote it to continue-on-error and investigate rather than
#     rebaselining per-platform.
#
# The synarchy.cabal `common warnings` stanza carries -Werror (#1057),
# scoped to the repository's own components (not dependencies), so the
# warning-clean state from #435 is enforced by the checked-in package
# configuration — the same policy a plain local build already applies —
# rather than being turned on only here.
#
# Build caching (#526, reworked in #671): the GHC/cabal toolchain and a
# hackage index snapshot are baked into the CI image (see
# .github/ci/Dockerfile; the old actions/cache toolchain cache never hit
# inside the container, so GHC was silently re-downloaded every run), and
# two caches persist across runs so a typical PR recompiles only the
# modules it changed rather than all 360+ —
#   1. the cabal dependency store (at the image-pinned CABAL_DIR), and
#   2. the project build products (dist-newstyle), so GHC's recompilation
#      avoidance rebuilds only dirty modules + their reverse-deps.
# The dist-newstyle key includes the exact immutable CI image reference,
# GHC/Cabal versions, dependency plan hash and a deterministic eight-change
# epoch. `ci_cache_epoch.py`
# counts only first-parent master changes that touch compiled-product
# inputs after its checked-in anchor; docs, Lua and runtime resources do
# not age this cache. Pull requests derive the epoch from their BASE SHA
# and are restore-only, so the entry they consume is always master-scoped.
# A successful master push is the sole writer. Each eighth relevant change
# advances the key, restores the newest compatible older epoch, and saves
# the freshly built tree at the very end of the job. This bounds compile
# drift without a cron workflow or one cache per commit.
#
# `actions/cache` entries are immutable, so restore and save remain
# separate and an exact hit never re-saves. Concurrent master writers of
# a new epoch are benign: one wins the immutable key and the other gets
# "already exists". v3 restore prefixes first prefer an older epoch of
# the same plan, then any v3 plan for this exact image/toolchain. Legacy v2
# is allowed only for the immutable image known to have created it, so the
# first v3 epoch can bootstrap without letting a later image reuse incompatible
# products. The `ci-9eaa...` comparison below is therefore HISTORICAL and must
# not be updated when the image recipe changes. `tools/ci_cache_cleanup.py` is
# the explicit, dry-run-first
# retention tool. It keeps the newest three compatible snapshots by default,
# never selects dependency or PR caches, and refuses to select legacy v2
# until it can see a successfully seeded v3 replacement on master.
#
# CI-image publication ordering (#784): this file and ci-image.yml used
# to race as two fully independent workflows — both fired on the same
# push, with no ordering between "publish a new image" and "consume the
# fixed tag", so a Dockerfile-changing push could start the test workers
# against the STALE previous image while the new one was still being
# built, and a Dockerfile-changing PR never built or validated its
# candidate at all (ci-image.yml had no pull_request trigger). The fix:
# resolve-image below calls ci-image.yml as a REUSABLE workflow
# (`uses: ./.github/workflows/ci-image.yml`) — its jobs join THIS run's
# dependency graph rather than running as a separate, unordered trigger
# — and both test jobs declare `needs: resolve-image`, so GitHub cannot
# start either container before resolve-image (and therefore ci-image.yml's
# own jobs) finishes. That's also why each container.image below is an
# expression referencing needs.resolve-image.outputs.image rather than a
# literal tag: GitHub resolves jobs.<job>.container.image using the `needs`
# context once every needed job has completed, so a job-level container CAN
# depend on a job earlier in the same run — the old belief that it couldn't
# (see #671's original literal-tag choice) is what let publication and
# consumption go unordered in the first place.
#
# ci-image.yml tags each build content-addressably: `ci-<sha256 of
# .github/ci/Dockerfile ++ .github/workflows/ci-image.yml itself, first
# 16 hex chars>` — deliberately covering BOTH files, so a PR that only
# changes the image-build recipe (not the Dockerfile) still mints a new
# tag and re-exercises the candidate build+validate path, not just a
# Dockerfile edit. A tag is only ever pushed ONCE — the first time that
# exact (Dockerfile, recipe) pair is seen — so an image reference
# already consumed by an in-progress or historical run can never be
# silently overwritten with different contents; a later edit to either
# file always produces a brand-new tag rather than mutating an old one.
# Every run (PR or push) computes this tag and does a cheap
# registry-metadata check (`docker buildx imagetools inspect`, no layer
# pull) to see if it already exists:
#   - Already published (the overwhelmingly common case — neither file
#     changed): resolve-image just resolves the existing tag, no rebuild.
#   - Not yet published (a Dockerfile- or recipe-changing push OR
#     pull_request): builds the candidate, hard-validates its baked
#     GHC/Cabal versions against the Dockerfile's own ARG defaults
#     (failing the job — and therefore build-test, transitively, via
#     `needs:` — if they don't match), and ONLY THEN pushes it under the
#     new content tag. This is what makes a Dockerfile/recipe-changing PR
#     build and validate its own candidate image before merge, rather
#     than deferring the first real build to master while that PR's own
#     CI still runs against the old contract.
# Docker builds aren't perfectly reproducible even from byte-identical
# input (e.g. `apt-get update`/an unpinned ghcup download can resolve
# different bytes on a later rebuild), so two concurrent runs that land
# on the SAME not-yet-published tag could otherwise both build and race
# to push possibly-different content to it. ci-image.yml's resolve job
# closes this with a job-level `concurrency:` group keyed on the tag
# itself: GitHub queues a second run sharing that group behind the
# first rather than letting both execute their check-then-push window
# concurrently, so by the time the second one's own existence check
# runs, the first one's publish (if any) has already landed and it
# always takes the fast, no-rebuild path instead of racing.
# There is no manual version-bump/refresh procedure to follow any more —
# editing the Dockerfile (or ci-image.yml's build recipe) IS the
# procedure; resolve-image detects the content change and publishes
# automatically as part of that same PR/push's CI run.
#
# Trade-off accepted at #526, still true now that -Werror lives in
# synarchy.cabal's checked-in warning policy (#1057) rather than being
# injected only here: there is NO separate from-scratch clean-build
# backstop job, in CI or locally. A warning that only surfaces on a full
# rebuild of the whole module graph (cross-module interactions in files
# that don't get recompiled) can therefore slip past -Werror; cached
# modules — this dist-newstyle cache, or a long-lived local build dir —
# are assumed to have been warning-free when built. A warning in any
# CHANGED / recompiled module still fails the build (-Werror stays on);
# see tools/ci-local.sh's -fforce-recomp for the local gate's mitigation.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A pull_request run SHOULD supersede its own older runs -- that is what
# cancel-in-progress is for, and it is kept.
#
# A master PUSH must never cancel another master push (#1490). Keying
# every push on its own SHA gives each master commit its own group, so
# pushes neither cancel nor queue behind one another. A shared group with
# `cancel-in-progress: false` is NOT sufficient: GitHub keeps only the
# newest PENDING run in a group and cancels older pending ones, which
# loses exactly the verdicts this exists to preserve.
#
# Why it matters: 39 of the 40 master runs before this change concluded
# `cancelled`, so master `559e946f`'s own run never reported the breakage
# it introduced. It surfaced only when PRs merged forward past it, by
# which point two of them had each burned their CI reruns and been
# quarantined by the drainer.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolves (building + validating + first-publishing when needed) the
  # immutable, content-addressed CI image tag both test jobs consume. Lives
  # in the separate reusable workflow .github/workflows/ci-image.yml
  # (not inlined here) so that file's own content participates in the
  # candidate's identity hash — see that file's header and the header
  # comment above for the full design (#784).
  resolve-image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  # Heavy build, hspec and engine-free audit worker. The stable `build-test`
  # context is the aggregate job below; keeping the worker separate lets it
  # overlap the real-engine behavior probes without weakening the drainer's
  # single-check merge gate.
  test-and-audits:
    needs: resolve-image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    container:
      # Resolved from resolve-image's output (#784) rather than a
      # literal tag — see the header comment above for why this is safe
      # and how it eliminates the old publish/consume race.
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # fetch-depth: 0 so the path-selective expensive-gate selectors can
      # diff a PR against its base to see which files changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The checkout is mounted from the hosted runner into this job's
      # container, so it can be owned by a different UID than the shell
      # running later steps. Trust this exact workspace before any direct
      # Git invocation (path-selective gates and probes both need it).
      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The toolchain is baked into the CI image (#671, content-addressed
      # and resolved by resolve-image since #784) — no haskell-actions/
      # setup, no toolchain cache. (The previous cache never hit inside
      # the container: the action installs via the mounted runner tool
      # cache, not the path we cached, so GHC was re-downloaded on every
      # run.) This step only exports the image's paths for later steps —
      # image ENV isn't reliably propagated through the runner's
      # docker-exec env — and hard-fails if the image is stale (no ghc/
      # cabal at these exact paths), rather than letting cabal silently
      # pick up some other compiler. resolve-image's own validate step
      # additionally hard-checks the exact baked GHC/Cabal version
      # strings before a candidate is ever published.
      - name: Toolchain (baked into the CI image)
        run: |
          /usr/local/.ghcup/bin/ghc --version
          /usr/local/.ghcup/bin/cabal --version
          echo "/usr/local/.ghcup/bin" >> "$GITHUB_PATH"
          echo "CABAL_DIR=/usr/local/cabal" >> "$GITHUB_ENV"

      # Docs-only fast path (#1490). A PR or push that changes ONLY
      # documentation cannot affect the Haskell half of this job -- no
      # target compiles a doc, and docs/save_compat/* is excluded because
      # its machine-readable contracts require the real-codec audit below.
      # Such a change therefore skips the cabal build, the test
      # suites, the headless hspec suite and world_check, and still runs
      # every engine-free Python audit below.
      #
      # Skipping every audit too would have been the natural reading of
      # "docs-only", and it would have been wrong: #1490's whole cause was
      # a docs-only push breaking test_findings_report_audit.py, whose
      # self-test reads docs/code_health_findings.md. Filtering docs out
      # of CI would have hidden that outright. Engine-free audits remain;
      # only the Cabal-backed save audit is skipped when its complete,
      # conservative input family is absent.
      #
      # PRs use base..HEAD; pushes use the COMPLETE pushed span
      # (before..after), so a batch push of several commits is judged as
      # one. --no-renames turns a rename into the delete+add pair the
      # selector rejects. The selector fails closed: a missing, zero, or
      # unresolvable base (a first push or a force push) runs the full job.
      - name: Select docs-only fast path
        id: docs-fast-path
        run: |
          DOCS_ONLY=false
          BASE=''
          AFTER='${{ github.sha }}'
          ZERO=0000000000000000000000000000000000000000
          ELIGIBLE=no
          : > /tmp/ci-changed-paths.txt
          if [ "${{ github.event_name }}" = pull_request ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
          elif [ "${{ github.event_name }}" = push ]; then
            BASE='${{ github.event.before }}'
          fi
          if [ -n "$BASE" ] && [ "$BASE" != "$ZERO" ]; then
            if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              ELIGIBLE=yes
            fi
          fi
          if [ "$ELIGIBLE" = yes ]; then
            git diff --no-renames --name-status "$BASE" "$AFTER" > /tmp/ci-change-range.txt
            git diff --name-only "$BASE" "$AFTER" > /tmp/ci-changed-paths.txt
            DOCS_ONLY="$(python3 tools/ci_docs_fast_path.py --stdin --explain < /tmp/ci-change-range.txt)"
          else
            echo "ci_docs_fast_path: no resolvable change range; running the full job"
          fi
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "docs-only fast path: $DOCS_ONLY"

      # Pull requests consume the epoch already established by their base;
      # only a post-merge master build is allowed to advance and publish it.
      # The history-derived selection is CI orchestration and has no local
      # cache counterpart; its self-test runs with the engine-free audits.
      - name: Select project build cache epoch
        if: steps.docs-fast-path.outputs.docs_only != 'true'
        id: cache-epoch
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            CACHE_REF='${{ github.event.pull_request.base.sha }}'
          else
            CACHE_REF='${{ github.sha }}'
          fi
          python3 tools/ci_cache_epoch.py --ref "$CACHE_REF" --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Resolve dependency plan
        if: steps.docs-fast-path.outputs.docs_only != 'true'
        run: |
          # Resolve ONCE against the image's own baked index, before the
          # update below can hide a problem with it (#1354). cabal.project
          # pins `index-state`, and that pin is only load-bearing while it
          # stays at or before the snapshot `cabal update` baked into this
          # image at build time; a pin newer than that resolves here only
          # because of the per-run delta fetch, which puts every CI run
          # back at the mercy of a live index — the coupling the pin
          # exists to remove. Cabal fails hard ("Latest known index-state
          # ... is older than the requested index-state") rather than
          # quietly resolving something else, so this line is the whole
          # check. Fixing a failure here means moving the pin back, or
          # editing .github/ci/Dockerfile so a new image with a newer
          # baked index is published — never deleting this resolve.
          cabal build all --dry-run
          # Incremental against the index snapshot baked into the image —
          # a delta fetch of seconds, not a full index download.
          cabal update
          # -Werror is part of the checked-in warning policy now
          # (synarchy.cabal's `common warnings` stanza, #1057) — there is
          # nothing to configure here. --dry-run only produces
          # dist-newstyle/cache/plan.json, which the cache keys below hash.
          cabal build all --dry-run

      # Hspec is deliberately full and blocking on every non-docs-only PR. These
      # independent gates are path-selective on PRs, but always run after a
      # non-docs-only merge so master retains the complete regression
      # backstop. A docs-only push reuses the exact range already resolved
      # above, allowing Cabal-backed gates to stay off without classifying
      # every tracked source file as changed.
      - name: Select expensive path-relevant gates
        id: expensive-gates
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
            git fetch --no-tags origin "$BASE"
            CHANGED="$(git diff --name-only "$BASE" HEAD)"
          elif [ "${{ steps.docs-fast-path.outputs.docs_only }}" = true ]; then
            CHANGED="$(cat /tmp/ci-changed-paths.txt)"
          else
            CHANGED="$(git ls-files)"
          fi
          {
            printf '%s\n' "$CHANGED" | python3 tools/ci_expensive_gates.py --stdin --gate worldgen | \
              sed 's/^/worldgen=/'
            printf '%s\n' "$CHANGED" | python3 tools/ci_expensive_gates.py --stdin --gate graphical | \
              sed 's/^/graphical=/'
            printf '%s\n' "$CHANGED" | python3 tools/ci_expensive_gates.py --stdin --gate unit-assets | \
              sed 's/^/unit-assets=/'
            printf '%s\n' "$CHANGED" | python3 tools/ci_expensive_gates.py --stdin --gate save-compat | \
              sed 's/^/save-compat=/'
          } >> "$GITHUB_OUTPUT"

      # plan.json exists after --dry-run; its hash keys the store cache.
      # The store path is static because the image pins CABAL_DIR (#671).
      - name: Restore dependency cache
        if: steps.docs-fast-path.outputs.docs_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: /usr/local/cabal/store
          key: deps-v2-${{ runner.os }}-ghc9.12.2-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: deps-v2-${{ runner.os }}-ghc9.12.2-

      # Cache project products so GHC recompiles only dirty modules.
      # plan.json keys compatibility; the eight-change epoch bounds how
      # stale an immutable snapshot can become. Same-plan older epochs are
      # preferred, then any v3 plan for partial reuse. Legacy v2 is a final
      # bootstrap only while the resolved image is the exact image that wrote
      # those entries; an image-only change therefore starts from compatible
      # dependencies but never restores old project objects.
      #
      # Split out of the combined `actions/cache` action (#1358), which
      # is the only way to learn WHICH key a prefix hit restored: the
      # combined action stashes the matched key in step STATE for its own
      # post step and publishes just `cache-hit`, while
      # `actions/cache/restore` publishes `cache-primary-key` and
      # `cache-matched-key` as outputs the report step below can read.
      # The key, the path and the restore-keys are untouched, and the
      # save step reproduces the combined action's conditions term for
      # term — see it.
      - name: Restore project build cache (dist-newstyle)
        if: steps.docs-fast-path.outputs.docs_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dist-cache
        with:
          path: dist-newstyle
          key: dist-v3-${{ runner.os }}-${{ needs.resolve-image.outputs.image }}-ghc-9.12.2-cabal-3.16.1.0-${{ hashFiles('dist-newstyle/cache/plan.json') }}-epoch-${{ steps.cache-epoch.outputs.epoch }}
          restore-keys: |
            dist-v3-${{ runner.os }}-${{ needs.resolve-image.outputs.image }}-ghc-9.12.2-cabal-3.16.1.0-${{ hashFiles('dist-newstyle/cache/plan.json') }}-epoch-
            dist-v3-${{ runner.os }}-${{ needs.resolve-image.outputs.image }}-ghc-9.12.2-cabal-3.16.1.0-
            ${{ needs.resolve-image.outputs.image == 'ghcr.io/coghex/synarchy-ci:ci-9eaa6afb33b34025' && format('dist-v2-{0}-ghc-9.12.2-cabal-3.16.1.0-', runner.os) || 'dist-v2-disabled-for-incompatible-image-' }}

      # Classify what each of the two restores above actually got: exact
      # hit, prefix hit (naming the key it restored), or full miss
      # (#1358). All three exit zero today and differ only in wall-clock,
      # so a systematic slide into cold caches — a key-scheme edit, LRU
      # eviction against the 10 GB repository quota, branch scoping
      # denying a PR access to master's cache, a backend regression —
      # would multiply every build's cost with nothing turning red.
      #
      # Reporting only: the script exits 0 for every outcome, and a full
      # miss emits a NON-failing annotation — warning on a master push,
      # where master's own previous build populated the cache, and notice
      # on a PR, where a miss can be legitimate. A first build after a
      # real dependency change legitimately misses, and a gate that cries
      # wolf gets ignored.
      #
      # Deliberately NOT carrying the docs-only term the cache steps
      # have: that fast path skips those steps, which leaves their
      # outputs empty and therefore indistinguishable from a cold cache,
      # so the reporter is TOLD instead — which puts the case under
      # --self-test rather than under an untested workflow expression.
      # That self-test also re-checks that both caches are still restored
      # by `actions/cache/restore` under the ids bound below: reverting
      # either to the combined action would leave `cache-matched-key`
      # permanently empty and silently turn every prefix hit into a
      # reported full miss.
      - name: Report cache restore outcomes
        env:
          CI_CACHE_DOCS_ONLY: ${{ steps.docs-fast-path.outputs.docs_only }}
          CI_CACHE_EVENT_NAME: ${{ github.event_name }}
          CI_CACHE_DEPS_HIT: ${{ steps.cache.outputs.cache-hit }}
          CI_CACHE_DEPS_PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CI_CACHE_DEPS_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          CI_CACHE_DIST_HIT: ${{ steps.dist-cache.outputs.cache-hit }}
          CI_CACHE_DIST_PRIMARY_KEY: ${{ steps.dist-cache.outputs.cache-primary-key }}
          CI_CACHE_DIST_MATCHED_KEY: ${{ steps.dist-cache.outputs.cache-matched-key }}
        run: |
          python3 tools/ci_cache_epoch.py --self-test
          python3 tools/ci_cache_cleanup.py --self-test
          python3 tools/ci_cache_report.py --self-test
          python3 tools/ci_cache_report.py

      - name: Build dependencies
        if: steps.docs-fast-path.outputs.docs_only != 'true'
        run: cabal build all --only-dependencies

      # Save the store as soon as deps are built, so a later failure in
      # the package build doesn't throw away the expensive part.
      - name: Save dependency cache
        # The fast-path term is load-bearing, not defensive: when the
        # restore step is skipped, steps.cache.outputs.cache-hit is
        # EMPTY, which satisfies `!= 'true'` -- so without it this step
        # would run on a docs-only push and save a store that was never
        # populated, under a key hashing a plan.json that was never
        # written.
        if: >-
          steps.cache.outputs.cache-hit != 'true'
          && steps.docs-fast-path.outputs.docs_only != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/cabal/store
          key: deps-v2-${{ runner.os }}-ghc9.12.2-${{ hashFiles('dist-newstyle/cache/plan.json') }}

      - name: Build (library + executable)
        if: steps.docs-fast-path.outputs.docs_only != 'true'
        run: cabal build all

      - name: Build test suites
        if: steps.docs-fast-path.outputs.docs_only != 'true'
        run: |
          cabal build synarchy-test-headless
          if [ "${{ steps.expensive-gates.outputs.graphical }}" = true ]; then
            cabal build synarchy-test-graphical
          else
            echo "Skipping graphical test-suite build: no graphics-facing paths changed."
          fi

      # The suite itself is unconditional; SYNARCHY_FULL_TESTS only
      # decides whether its full-tier examples run or report pending
      # (#1364). Today that is exactly one example --
      # test-headless/Test/Headless/WorldGen/Exposure.hs's w128 seed-42
      # volcano regression, whose dedicated w128 generation is the whole
      # reason it is not on every run. It rides the SAME worldgen
      # selector as world_check --quick below, so a worldgen-output PR
      # gets both and a push to master (where the selector reports every
      # gate) gets them unconditionally.
      #
      # Deliberately an if/else around the command rather than a step
      # `env:` with a conditional expression: an expression that
      # evaluates to '' still SETS the variable, and the test's guard
      # matches `Just _`, so the empty-string branch would silently run
      # the expensive case on every PR. The disabled branch has to leave
      # the variable genuinely ABSENT from the test process's
      # environment, which the bare invocation below does.
      - name: Headless test suite
        if: steps.docs-fast-path.outputs.docs_only != 'true'
        run: |
          if [ "${{ steps.expensive-gates.outputs.worldgen }}" = true ]; then
            echo "worldgen gate fired: running the full tier (SYNARCHY_FULL_TESTS=1)."
            SYNARCHY_FULL_TESTS=1 cabal test synarchy-test-headless --test-show-details=direct
          else
            echo "worldgen gate did not fire: full-tier examples stay pending."
            cabal test synarchy-test-headless --test-show-details=direct
          fi

      - name: Test audit
        run: python3 tools/test_audit.py

      # Cheap, no-engine guard (#1724): the executable specification of
      # what tools/world_determinism.py means by "content-identical" ---
      # a reversed tile array and a reordered-key tile must hash equal,
      # a changed field, a missing tile and an unstable canonical form
      # must not. Issue #23 / PR #34 chose content identity over byte
      # identity deliberately, and this is the only place that choice is
      # asserted. world_check.py hashing six real seeds against their
      # baselines (#1361) does not cover it: the engine emits tiles in a
      # stable order, so a regression that made the checker order-
      # SENSITIVE would still produce matching hashes and pass. Pure
      # Python, no engine, no GPU, no network, sub-second --- and
      # unconditional rather than behind the worldgen selector, because
      # the contract lives in tools/ and can be broken by a change that
      # selector would not fire on.
      - name: World determinism content-identity self-test
        run: python3 tools/test_determinism.py

      # Cheap, no-engine guard (#538/#541/#545): fails if a Lua module
      # that was split to stay reviewable (the debug overlay,
      # unit-resource physiology, or unit-AI splits) grows back past
      # its agreed line budget.
      - name: Lua module line budget
        run: python3 tools/lua_module_budget.py

      # Cheap, no-engine guard (#814): fails if a scripts/ui/*.lua widget
      # module gains a second top-level definition of an already-defined
      # exported function, which silently overwrites the earlier one in
      # the module table with no error (the slider.findByElementHandle
      # regression this issue fixed). The fixture suite (#1324) runs
      # first: it pins both directions of every rule the audit enforces,
      # including the two false-greens -- an unrecognized in-scope file
      # and an empty corpus -- that used to report the same clean
      # success a real scan does.
      - name: Lua duplicate function audit
        run: |
          python3 tools/test_lua_duplicate_function_audit.py
          python3 tools/lua_duplicate_function_audit.py

      # Cheap, no-engine guard (#787): fails if a Haskell module split
      # to stay reviewable (the input-thread facade + its dispatch
      # submodules) grows back past its agreed line budget.
      - name: Haskell module line budget
        run: |
          python3 tools/test_haskell_module_budget.py
          python3 tools/haskell_module_budget.py

      # Cheap, no-engine guard (#1005, #1494): fails if any of the five
      # ASCII operators normalised to Unicode (.&., .|., >>=, ==, /=)
      # reappears in src/+app/ Haskell source, or if inequality is
      # spelled with the noncanonical Unicode ≠ instead of ≢ -- either
      # way outside the guard's explicit, construct-scoped exemption
      # list (src/UPrelude.hs's ASCII definitions, ShaderCode.hs's
      # quasiquoted GLSL, and the Eq/Monad instance method names that
      # must stay ASCII). ≠ stays legal in comment prose.
      - name: Unicode operator audit
        run: |
          python3 tools/test_unicode_operator_audit.py
          python3 tools/unicode_operator_audit.py

      # Cheap, no-engine guard (#1605, restoring #665's sweep): fails
      # if a QUALIFIED reference to Data.Text.Encoding.decodeUtf8 --
      # under any alias, and with `qualified` written either side of the
      # module name -- appears in code under src/Engine/Scripting/Lua/.
      # A Lua string is an arbitrary byte array, so a strict decode
      # throws UnicodeException on malformed input (closed #618) instead
      # of letting the call site refuse the value. Never flagged: the
      # total siblings decodeUtf8'/decodeUtf8With/decodeUtf8Lenient,
      # comments, string literals, imports, and a same-named function
      # from any other module. Qualified references are the whole
      # decidable domain -- a bare name needs Haskell scope analysis, so
      # a file that would require it (an unqualified import of the
      # module, or an identifier-rewriting CPP directive) is REFUSED
      # rather than certified. The regression this catches is commit
      # 893cbd8f (#1217), which reintroduced two strict calls 37 days
      # after the sweep and passed both review and the headless suite.
      - name: Lua strict-decode audit
        run: |
          python3 tools/lua_strict_decode_audit.py --self-test
          python3 tools/lua_strict_decode_audit.py

      # Cheap, no-engine guard (#756 req 10): fails if a field is added
      # to a root state owner (EngineEnv, EngineState, WorldManager,
      # WorldState, the World.Save.Types envelope) or a new Lua module
      # is registered with scripts/lib/save_modules.lua without a
      # matching classification landing in
      # docs/persistence_state_inventory.md. See
      # docs/persistence_contract.md SS7 for what this does and doesn't
      # guarantee.
      - name: Persistence inventory audit
        run: |
          python3 tools/test_persistence_inventory_audit.py
          python3 tools/persistence_inventory_audit.py

      # Cheap, no-engine guard (issue #876, EngineEnv capability epic
      # #537 requirement 8): fails if a field is added to or removed
      # from EngineEnv without a matching capability/thread/lifecycle
      # classification landing in
      # docs/engineenv_capability_inventory.md. This is a separate axis
      # from the persistence-inventory audit above (capability/thread/
      # lifecycle ownership, not save/load classification) -- see that
      # document's own introduction for how the two relate.
      - name: EngineEnv capability inventory audit
        run: |
          python3 tools/test_engine_env_capability_audit.py
          python3 tools/engine_env_capability_audit.py

      # Guard (issue #766, save-overhaul C4 requirement 14): fails if a
      # tracked save-compatibility fixture drifts, goes missing, or the
      # frozen-DTO/envelope-framing fingerprints recorded in
      # docs/save_compat/manifest.json disagree with the current source.
      # See tools/save_compat_audit.py's module docstring for exactly
      # what this does and does not guarantee.
      #
      # Both commands here stay blocking on every non-docs-only change,
      # and on every save-compat input change. --without-reproducibility
      # (#1360) removes exactly ONE
      # member of the self-test module -- the one that spawns its own
      # `cabal repl` to build two timestamp variants -- which the next
      # step runs path-selectively instead. Every other member still
      # runs, and so does the whole real audit.
      #
      # Note this step is NOT cabal-free even so, and was never meant to
      # become so: save_compat_audit.py's real-manifest run decodes the
      # tracked fixtures' envelope descriptors through a `cabal repl` of
      # its own (verify_fixture_descriptors -> dump_fixture_descriptors),
      # and test_real_manifest_passes_the_audit runs that same audit. The
      # saving here is one ADDITIONAL repl, not all of them.
      - name: Save compatibility audit
        if: >-
          steps.docs-fast-path.outputs.docs_only != 'true'
          || steps.expensive-gates.outputs.save-compat == 'true'
        run: |
          python3 tools/test_save_compat_audit.py --without-reproducibility
          python3 tools/save_compat_audit.py

      # The one cabal-repl member of that module, split out and selected
      # by changed paths (#1360). It proves --generate-session's output
      # is independent of when the command ran, by encoding two envelopes
      # differing only in smTimestamp and showing normalize_fixture_
      # timestamp collapses them to identical bytes. That exercises
      # fixture GENERATION, which only a save-format, fixture,
      # save-tooling or Cabal change can move -- so an unrelated pull
      # request no longer pays its ~26 s.
      #
      # Path-selective on PRs and docs-only master pushes. Every other
      # master push feeds the selector all tracked files, retaining the
      # post-merge backstop. The gate's own --self-test pins both
      # directions, and
      # tools/ci_parity_audit.py pins that `make ci` selects it from the
      # same decision.
      - name: Save compatibility fixture reproducibility
        if: steps.expensive-gates.outputs.save-compat == 'true'
        run: python3 tools/test_save_compat_audit.py --only-reproducibility

      # Cheap, no-engine guard (issue #1145): fails if a
      # positionally-serialized (`Generic`-derived `Serialize`) sum type's
      # constructor list changes in any way that is not a pure append.
      # The tag is an index, so a reorder/insert/remove/rename silently
      # reinterprets every already-saved value with nothing failing to
      # compile -- and so does reordering or retyping ONE constructor's
      # fields, which are positional too and move no tag at all (#1270).
      # The compat fixtures above only prove the handful of
      # constructors they happen to carry. Deliberately unconditional
      # rather than path-selective: the guarded set is discovered from
      # every `src/`/`app/` module, and the baseline it compares against
      # can drift from either side.
      - name: Enum append-only audit
        run: |
          python3 tools/enum_append_only_audit.py --self-test
          python3 tools/enum_append_only_audit.py

      # Cheap, no-engine guard (issue #972, CH-28): fails if a
      # `src/**/*.hs` module is missing from synarchy.cabal's explicit
      # library inventory. Deliberately unconditional rather than
      # path-selective -- an unlisted module is invisible to every other
      # gate (the build stays green precisely because the file is not
      # part of it), and a filter keyed on `src/` would not fire for a
      # cabal-only edit that drops a module from the list.
      - name: Cabal library module inventory audit
        run: |
          python3 tools/test_cabal_module_audit.py
          python3 tools/cabal_module_audit.py

      # Cheap, no-engine guard (issue #1118): fails if src/World/Material.hs's
      # `mat*` constants and data/materials/*.yaml stop declaring the same
      # ids and names. The two are hand-maintained copies of one table and
      # the constants are literals, so a catalogue id changed, reused, or
      # newly assigned by a content author leaves the Haskell constants
      # resolving the wrong material with nothing failing to compile --
      # and 51 of the constants have no consumer outside Material.hs, so
      # no code path notices either. Unconditional rather than
      # path-selective: it is a two-file comparison that costs
      # milliseconds, and either side can drift alone.
      - name: Material id/name correspondence audit
        run: |
          python3 tools/material_id_audit.py --self-test
          python3 tools/material_id_audit.py

      # Cheap, no-engine guard (issue #1740): fails if an authoritative
      # bare-name icon reference does not resolve through the runtime's
      # GLOBAL icon index. Unit-info panel icons are referenced by bare
      # basename, and scripts/unit_info_v2_panel_engine.lua consults a
      # row's "<kind>_unknown" placeholder only when the basename misses
      # that index -- so a deleted or misspelled basename renders a
      # placeholder instead of erroring, which is indistinguishable from
      # art that has not landed yet. Nothing verified those references,
      # and the tracked tree really had drifted (knowledge_basic_cuisine
      # was mapped but absent). It also pins the two runtime icon-family
      # inventories to each other and to the per-family fallback assets.
      # Unconditional rather than path-selective: it reads a handful of
      # scripts and directory listings and costs milliseconds, and either
      # the Lua maps or the assets can drift alone.
      - name: Bare-name icon asset check
        run: |
          python3 tools/bare_name_icon_asset_check.py --self-test
          python3 tools/bare_name_icon_asset_check.py

      # Cheap, no-engine guard (issue #1717): fails if a concept id
      # data/language/concepts.yaml has ever shipped is missing from it,
      # or if a new one arrived without being ratcheted into
      # data/language/concept_id_baseline.json. A ConceptId is persisted
      # identity -- Language.Etymology reports one the catalogue no
      # longer carries as EtyInvalidConcept, so every already-persisted
      # EtymologySource naming it loses its etymology -- and
      # Language.Generated.Hash seeds each concept's native root from the
      # id string, so a rename re-roots the concept. Nothing else names
      # an individual id: the headless suite's catalogue checks are all
      # aggregates (version, count, domains, balance, forms), and the
      # location/river naming goldens cover only the handful of concepts
      # their samples happen to use. Unconditional rather than
      # path-selective: it is a two-file comparison costing
      # milliseconds, and either side can drift alone. Since #1868 the
      # artifact also records each id's append-only ORDINAL, which is
      # the order Language.Generated.Root places concepts in, and the
      # audit fails an artifact whose ordinals are no longer that
      # append-only sequence -- an addition taking an incumbent's
      # position would move that incumbent's generated root.
      - name: Concept id inventory audit
        run: |
          python3 tools/concept_id_inventory_audit.py --self-test
          python3 tools/concept_id_inventory_audit.py

      # Cheap, no-engine guard (issue #1704): fails if an F4 Tier 1
      # (Layer A) input area's mapping is stranded -- a producer renamed
      # or moved out from under tools/action_outcome_coverage.py -- or
      # if its instrumentation was deleted outright. The plain coverage
      # report cannot tell those two apart and exits 0 for both, which
      # is exactly how #787's input-thread split left five fully
      # instrumented Layer A areas reporting as gaps, unnoticed, with
      # nothing failing: the pre-#1704 self-test proved its patterns
      # against constructed source strings and never touched the real
      # tree. Unconditional rather than path-selective: the stranding is
      # caused by the very rename that moves the file a path filter
      # would key on, and the check is a handful of regex searches
      # costing milliseconds. Tier 2/3 gaps stay deliberate fast-follows
      # (#646) -- this gate ignores them, and the plain report keeps
      # exit status 0.
      - name: F4 action-outcome Tier 1 coverage mapping gate
        run: |
          python3 tools/action_outcome_coverage.py --self-test
          python3 tools/action_outcome_coverage.py --verify-tier1

      # Cheap, no-engine guard (issue #1196): fails if a CH item's
      # `## Status` checklist marker and its `### ` heading marker
      # disagree. Two independent lanes write the findings report --
      # the processing lane owns the status fields, an implementation
      # PR owns only the narrative body -- and both drift directions
      # have already happened (82607204, 89b015d3), each of which
      # re-files merged work. Unconditional rather than
      # path-selective: it is a single-file comparison costing
      # milliseconds, and it must fire on the report edit itself.
      - name: Findings report status audit
        run: |
          python3 tools/test_findings_report_audit.py
          python3 tools/findings_report_audit.py

      # Unit-asset gate. One command, three checks:
      #   #1257 inventory  -- filesystem-first validation that every
      #     committed PNG under assets/textures/units/<unit>/animations/
      #     is owned by exactly one animation-frame declaration in
      #     data/units/*.yaml, under either the gameplay `units:` or the
      #     asset-only `asset_units:` form;
      #   #1258 freshness  -- every generated atlas/index regenerated
      #     from the live sources and compared;
      #   #1262 budgets    -- at most one resident image and bindless
      #     registration per compiled animation (a hard error, and what
      #     catches a reintroduced per-frame registration), plus the
      #     resident-memory budget in tools/unit_texture_budget.json
      #     whose breach activates deferred TEX-5. That one WARNS, so
      #     --strict below is what makes it blocking.
      # Path-selective on PRs; unconditional after a merge to master, so
      # a path the selector does not list can never leave the inventory
      # unchecked on master. The self-test runs first: it proves the
      # checker still fails on each violation class, so a green strict
      # run below cannot be a vacuously permissive checker.
      - name: Unit asset inventory, freshness and budget
        if: >-
          github.event_name != 'pull_request'
          || steps.expensive-gates.outputs.unit-assets == 'true'
        run: |
          python3 tools/test_pack_atlas.py
          python3 tools/pack_atlas.py --validate-only --strict

      # The #428 guard that had never been wired to anything (#1705).
      # Issue #428 required a path-existence check as the mandatory
      # guard against its own headline failure mode -- a missed
      # `assets/textures/...` reference after a texture move renders
      # MAGENTA in-engine rather than erroring, so nothing fails, it
      # just looks wrong. tools/check_texture_paths.py shipped as that
      # guard in PR #430 and was then run by nothing: neither this
      # workflow, nor tools/ci-local.sh, nor the Makefile or Cabal. A
      # real moved or missing texture merged with it never running.
      # Unconditional rather than path-selective: it costs a fraction of
      # a second, and the reference and the file it names live in
      # different trees, so either side can break the other alone.
      # The self-test runs first: it proves the checker still reports a
      # missing reference of each supported shape, and still lexes
      # comment from code, so a green run below cannot be a checker that
      # had quietly stopped scanning.
      - name: Texture path existence check
        run: |
          python3 tools/test_check_texture_paths.py
          python3 tools/check_texture_paths.py

      # Worldgen regression gate — see the header comment. Baselines
      # are tracked in tools/baselines/ (#421), captured on the primary
      # dev machine (macOS/aarch64); Linux output matches them exactly.
      - name: world_check --quick
        if: >-
          steps.expensive-gates.outputs.worldgen == 'true'
          && steps.docs-fast-path.outputs.docs_only != 'true'
        run: python3 tools/world_check.py --quick

      # Validate the probe-runner harness itself on every run (cheap, no
      # engine, no GPU). ci_probes/ci_expensive_gates cover the
      # path->probe mapping, which would otherwise only surface as a PR
      # mis-selecting; test_run_probes covers run_probes.py's own
      # process-group teardown (#1323) against synthetic probes and
      # synthetic engine descendants, plus (#1321) --exact rejecting
      # unknown probe keys instead of silently dropping them;
      # test_persistence_contract_sweep covers the companion registry-
      # drift guard that keeps persistence_contract_sweep.py's own
      # cross-probe key list from going stale against that registry
      # (#1321), which nothing else exercises;
      # test_action_outcome_probe covers action_outcome_probe.py's
      # chop-fixture classification (#1398) — setup-vs-behavior failure
      # and the 0/1/2 exit contract — against a fake console, so the
      # branches are checked without the probe's own ~8-minute real
      # engine and 64-world generation, and (#1793) its
      # find_mixed_box anchor filter and 5x5 sweep reading
      # world.getFluidAt through that query's ARITY contract. That
      # probe itself stays manual-only and out of the
      # path-selective gate; only this engine-free companion runs
      # here. test_tillable_fluid_filter is #1793's own: the
      # tillable-tile scans in till_probe, plant_probe and
      # farm_ai_probe decode world.getFluidAt by arity too, so a
      # flat, flora-free tile under water is never returned as
      # tillable. It owns the fake console that reproduces the
      # debug console's tab-joined multi-return — the thing a
      # sloppier test double would paper over — and
      # test_action_outcome_probe imports it rather than
      # re-deriving it, so the two cannot drift. Those three
      # probes each boot a real engine and generate a world; this
      # companion boots nothing. test_probelib pins
      # probelib.send_json's result contract (empty -> None, valid JSON
      # -> value, invalid JSON -> text) against a real socket speaking
      # the console protocol, and fails if a probe grows a private JSON
      # console wrapper again — the twenty-two-copy duplication #1160
      # removed. It also owns probe_engine.py's launcher contract
      # (#1570): under the aggregate runner a probe execs the one
      # already-resolved binary with no Cabal in its argv, while a probe
      # run by hand BUILDS one first (#1913) — inside an exclusive
      # cabal-build hold, owning that build's process group, on its own
      # 1800 s allowance — so the READY deadline that follows measures
      # engine startup and a build that fails is reported as a
      # preparation failure carrying its own output.
      # test_probe_flake mutation-covers probe_protocol.py,
      # probe_flake.py and probe_census.py's parsers from both sides,
      # engine-free and GPU-free, and every #1426 protocol migration
      # extends it with another standalone case, so each of those
      # migrations shipped with a gate nothing ran until #1475.
      # test_probe_census is the census's own self-test — the record,
      # its atomic writer, the declared schema, and #1429's cohort,
      # freshness and staleness semantics — driving synthetic documents
      # in throwaway temporary trees, so it touches no docs worktree and
      # boots nothing. test_probe_claim is #1434's: the atomic per-probe
      # claim, its lease, ownership-safe takeover and release, and the
      # claim-aware orchestration boundary. Its concurrency cases start
      # real interpreters that race on a shared barrier file, and its
      # crash case SIGKILLs one of them, because a claim that has to
      # hold between OS processes cannot be proved by threads. Still
      # engine-free and GPU-free: no probe is ever executed.
      # test_probe_resource_lock is #1436's cross-process reader/writer
      # lock — the half run_probes' in-process ledger cannot provide —
      # proved with separate interpreters and one SIGKILLed holder,
      # because a lock that has to hold between OS processes cannot be
      # proved by threads either. test_deflake is the /deflake
      # orchestrator: every collaborator is an injected adapter, while
      # probe_census and probe_flake.Measurement themselves are driven
      # for real against throwaway censuses in temporary directories, so
      # the recorder claims it checks are the shipped recorder's. The
      # REAL engine-booting ten-run measurement is deliberately absent
      # from this job and from tools/ci-local.sh — tools/README.md states
      # that a real run is supplemental manual evidence and never a merge
      # gate. test_location_embark_probe is #1569's: the artifact
      # ownership of tools/location_embark_probe.py — one
      # invocation-owned directory, --resource-root on every boot,
      # release on a pass, a phase-0 return, an exception and a boot
      # abort, residue as a failing check, a pre-existing same-named
      # save slot left byte-identical, and a read-only checkout still
      # yielding a removable tree. It also carries #1746's second
      # contract for the same probe: both of that probe's saves return
      # the API's own acceptance Boolean and then wait for their OWN
      # request id to reach SaveCaptureComplete, and a save that is
      # refused, never reports a request id, fails or times out
      # suppresses every session that would read the slot. The probe
      # itself is manual-only needs-gpu, so without this companion those
      # contracts are only ever observed by a GPU run nothing here can
      # make; the companion boots nothing and runs in well under a
      # second.
      # test_location_probe_config_isolation is #1729's: the private
      # `config/` tree `tools/location_content_probe.py`,
      # `tools/location_overlay_probe.py` and
      # `tools/location_stamp_idempotent_probe.py` each stage, and that
      # `tools/portal_ghost_probe.py` shares by importing the first of
      # them. All four used to SYMLINK `config/` in beside the content
      # families as "read-only content" — but engine init is itself a
      # `config/` writer, so through that alias a run created files in
      # the developer's own checkout, and teardown, which unlinks the
      # alias rather than descending it, left them there. It drives each
      # builder against synthetic, read-only and real source trees,
      # asserting a copy that is neither a symlink nor an
      # `os.path.samefile` alias, an absent seeded `*.local.yaml`, a
      # source left byte- and mode-identical after both a new local file
      # and a rewrite through the root, a read-only source still
      # yielding a writable and removable tree, and a teardown that
      # never follows the content symlinks. Three of those probes are
      # long and the fourth is manual-only needs-gpu, so without this
      # companion the contract is only ever observed by runs neither
      # gate can make; the companion boots nothing and runs in well
      # under a second.
      # test_probe_root_cleanup is #1791's: the staging half of the
      # isolated-root contract `tools/foraging_probe.py`,
      # `tools/flora_growth_probe.py`, `tools/farm_ai_probe.py` and
      # `tools/item_temp_probe.py` each carry. A failure while STAGING
      # the run's throwaway root — the root, three symlinks, a copied
      # `config/`, `saves/` — used to bypass the cleanup guard entirely
      # and leave the invocation-owned tree on disk. It drives each
      # probe's real `main()` in a subprocess under injected staging and
      # removal faults, asserting a non-zero run, an operator-visible
      # cause, an absent base, a checkout left untouched behind the
      # symlinks, and no `engine.quit()` aimed at whoever else holds the
      # port. All four probes are manual-only, so without this companion
      # the boundary is only ever observed by long engine runs; the
      # companion boots nothing and runs in about a second.
      # test_flora_growth_probe is #1682's: the artifact ownership of
      # `tools/flora_growth_probe.py`, the other half of what #1616
      # started. Its two fixture YAMLs and its engine log were the fixed
      # `/tmp` names `probe_berry.yaml`, `probe_clover.yaml` and
      # `flora_growth_probe_engine.log`, each written with a truncating
      # `open(..., "w")`, carrying no PID, port or other invocation
      # identity, and removed by nothing — so two concurrent runs (a
      # supported mode: `run_probes.py --jobs N`) collided on all three,
      # and a developer's same-named file was truncated outright. All
      # three now live under the one directory the invocation already
      # owned. It drives the probe's real `main()` with `run_probe`
      # substituted: disjoint paths for two invocations, no legacy
      # `/tmp` name, release after a pass, an early return, an
      # exception, a boot abort and a handled Ctrl-C, opt-in
      # `--keep-artifacts` retaining on both a pass and a failure while
      # naming only what the run actually produced (never calling a
      # directory that was never created empty), a cleanup failure
      # making an otherwise clean run non-zero, a read-only checkout
      # still yielding a removable tree with the source's own modes
      # untouched, and an outside same-named decoy left byte-identical.
      # It pins the teardown boundary structurally as well as
      # behaviourally, because `probelib.boot` waits up to three minutes
      # for READY and a caller that learns of the engine only from the
      # return value owns nothing for that whole span: `boot` now hands
      # the handle over the statement after its `Popen` (`on_launch`, an
      # appended optional parameter no existing caller passes), and the
      # probe disposes of an engine it merely LAUNCHED directly rather
      # than through the port, since a boot fails on a busy port exactly
      # because somebody else's instance holds it. `test_probelib` owns
      # the launcher half, including that an interrupt or a failing
      # callback DURING the hand-off kills the child there rather than
      # let it escape holding the port. The shutdown is guarded the same
      # way: `quit_engine` sends, waits and hard-kills, all
      # interruptible, so it runs inside a finally whose fallback kills
      # the engine outright. It also pins what the
      # probe still proves: the registration order placement hashes are
      # indexed by (sorted real flora, then `probe_berry`, then
      # `probe_clover`), both fixture bodies by sha256, and
      # `load_fixture_yaml` still stopping the run at setup on a fixture
      # that registers nothing. That probe is manual-only and
      # worldgen-heavy, so without this companion the contract is only
      # ever observed by a run that generates a world; the companion
      # boots nothing and runs in about a second.
      # test_location_content_probe is #1884's: the artifact ownership of
      # `tools/location_content_probe.py`, the other half of what #1620
      # started. Its five fixture YAMLs and its engine log were the fixed
      # `/tmp` names `loc_content_probe_bogus.yaml`, `_bogus_loot.yaml`,
      # `_quinoa.yaml`, `_quinoa_loot.yaml`, `_dense.yaml` and
      # `location_content_engine.log`, each written with a truncating
      # `open(..., "w")`, carrying no PID, port or other invocation
      # identity, and removed by nothing — so two concurrent runs (a
      # supported mode: `run_probes.py --jobs N`) collided on all six,
      # and a developer's same-named file was truncated outright. The log
      # collision is the sharp one: the probe ASSERTS against that log
      # twice — the integrity diagnostic in phase 2 and the two
      # unknown-content warnings in phase 3 — so a foreign truncation
      # could turn a passing phase into a failure or a failure into a
      # pass. All six now live under the one directory the invocation
      # already owned for its save slots. It drives the probe's real
      # `main()` with `run` substituted: disjoint paths for two
      # invocations, five absolute fixture paths inside the run's own
      # tree, no legacy `/tmp` literal left in the module, every one of
      # those six legacy paths left exactly as the run found it, release
      # after a pass, a failure, an early return, an exception, a
      # `_PhaseAborted`, a boot abort and a handled Ctrl-C, an engine the
      # run merely LAUNCHED killed BEFORE the tree it was writing into is
      # removed, opt-in `--keep-artifacts` retaining on a pass, a failure
      # and a boot abort while naming only what the run actually
      # produced, a cleanup failure making an otherwise clean run
      # non-zero through #1620's own reporting, and an outside
      # same-named decoy left byte-identical. It also pins what the probe
      # still proves: all seven boots through the one funnel that hands
      # each this invocation's log and registers its process as it is
      # launched, both log-reading ASSERTIONS reading that same log, the
      # five fixture bodies by sha256, their registration order and
      # loaders, `load_fixture_yaml` still guarding every one of them,
      # and the three helpers `portal_ghost_probe` imports still intact.
      # That probe is manual-only and boots seven engines; the companion
      # boots nothing and runs in about a second.
      # test_movement_probe is #1586's: `tools/movement_probe.py --list`
      # is a metadata query, answered from scripts/movement_arena.lua
      # before any boot() and for every --mode, with the derived view
      # held to the runtime M.listCourses() by every real course run.
      # That probe is manual-only too, so without this companion a
      # reintroduced boot() on the listing path, a mode dispatch that
      # preempts --list again, or a silently empty inventory would only
      # ever be caught by hand. It boots nothing and runs in well under
      # a second.
      # test_farm_ai_probe is #1760's: `tools/farm_ai_probe.py`'s phase-9
      # capstone judges the auto-harvest by the yield's IDENTITY rather
      # than by its location at one instant, following the exact
      # harvested instance off the ground and into whoever picked it up.
      # That oracle's four classifications -- produced-on-ground,
      # carried, moved-after-pickup and the only failing one,
      # never-produced -- are scheduling-dependent in a real run, so this
      # companion drives `YieldTrail.ingest` with decoded samples and
      # pins all four deterministically, plus the arming baseline, the
      # owning-page (`item.getGroundForUnit`, #1666) resolution contract
      # and the plot-tile scoping. That probe is manual-only and takes
      # about eleven minutes; this boots nothing and runs in well under
      # a second.
      # test_probe_boot_logs is #1763's: `tools/preview_probe.py` and
      # `tools/offscreen_probe.py` each launch several engines in one
      # run, and `probelib.boot` opens its log truncating, so launches
      # sharing a path used to destroy each other's capture -- preview
      # kept only the last of about twenty-two, and offscreen's
      # port-reusing restart overwrote the long session that preceded
      # it. This companion pins the allocation and reporting halves: a
      # distinct path per launch including a repeated phase, earlier
      # captures intact under a truncating open, the three-engine
      # lifecycle with its restart, a phase-to-path map that survives a
      # boot which exits before READY, and no preview call site falling
      # back to the shared per-port default. Both probes need a GPU and
      # are manual-only, so without this companion a re-shared log would
      # only ever be noticed by a dev-machine run; the companion boots
      # nothing and runs in well under a second.
      #
      # tools/test_deflake_diagnosis.py (#1437) is deliberately absent
      # too, and from tools/ci-local.sh's mirrored list: that issue's
      # approved rereview amendment scopes the diagnosis lab's own
      # self-test to manual invocation, so it is run by hand when
      # tools/deflake_diagnosis.py changes rather than gated here.
      - name: probe runner self-tests
        run: |
          python3 tools/ci_probes.py --self-test
          python3 tools/ci_expensive_gates.py --self-test
          python3 tools/ci_docs_fast_path.py --self-test
          python3 tools/test_run_probes.py
          python3 tools/test_persistence_contract_sweep.py
          python3 tools/test_action_outcome_probe.py
          python3 tools/test_tillable_fluid_filter.py
          python3 tools/test_probelib.py
          python3 tools/test_probe_flake.py
          python3 tools/test_probe_census.py
          python3 tools/test_probe_claim.py
          python3 tools/test_probe_resource_lock.py
          python3 tools/test_deflake.py
          python3 tools/test_location_embark_probe.py
          python3 tools/test_location_probe_config_isolation.py
          python3 tools/test_probe_root_cleanup.py
          python3 tools/test_flora_growth_probe.py
          python3 tools/test_location_content_probe.py
          python3 tools/test_movement_probe.py
          python3 tools/test_farm_ai_probe.py
          python3 tools/test_probe_boot_logs.py

      # The decision `.github/workflows/review-gate.yml` makes on every
      # synchronize push: keep `reviewed:approve` only when the push left
      # this PR's own patch identical (#1679). That job runs on a
      # different event from this workflow and mutates a label rather
      # than producing a check, so nothing here would ever notice it
      # regressing; its policy is only observable through this
      # self-test. Engine-free and network-free -- it builds throwaway
      # commit graphs in a temporary directory and runs in about a
      # second.
      - name: Review-gate decision self-test
        run: |
          python3 tools/review_gate_decision.py --self-test

      # Cheap, no-engine guard (#1355): fails if a `python3 tools/*.py`
      # check runs in this job and not in tools/ci-local.sh, or the other
      # way round, outside the audit's hard-coded exemption list (CI's
      # path selectors, which `make ci` has nothing to select for).
      # CLAUDE.md promises `make ci` predicts
      # this job's result; nothing enforced that and it had already
      # drifted -- the original five of the probe-runner self-tests above
      # ran only here.
      - name: CI/local gate parity audit
        run: |
          python3 tools/ci_parity_audit.py --self-test
          python3 tools/ci_parity_audit.py

      # The other half of the #1358 restore/save split above. It has to
      # reproduce the combined `actions/cache` action's post step, and it
      # does so term for term:
      #   * `post-if: success()` — a step `if:` naming no status function
      #     has `success()` applied implicitly, so this is skipped
      #     whenever an earlier step failed or the job was cancelled,
      #     exactly as that post step was.
      #   * LAST step in the job, so dist-newstyle is captured in the
      #     same final state a post step would have seen.
      #   * Save only on successful MASTER pushes when the EXACT key missed.
      #     Pull requests are intentionally restore-only so every reusable
      #     project snapshot lives in default-branch scope. The combined action's
      #     save half compares its primary key against the key it
      #     restored and skips on an exact match — that is what keeps one
      #     immutable snapshot per plan/epoch. `actions/cache/save` has no
      #     such check of its own, so the cache-hit term is load-bearing
      #     here exactly as it is on the dependency save above.
      #   * `key:` is the restore step's OWN `cache-primary-key` output,
      #     not a second `hashFiles(...)` evaluation. The combined action
      #     saves under the key its restore half evaluated, carried in
      #     step state; re-hashing plan.json here would save under
      #     whatever the file hashes to after the whole build instead —
      #     a different key from the one the cache-hit term above was
      #     decided against. That output is empty in exactly the case
      #     where the combined action's save half logged "Error
      #     retrieving key from state" and returned, so the emptiness
      #     term keeps that a no-op rather than an invalid-input failure.
      # The docs-only term is load-bearing for the same reason it is on
      # the dependency save: a skipped restore step leaves cache-hit
      # EMPTY, which satisfies `!= 'true'`.
      - name: Save project build cache (dist-newstyle)
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/master'
          && steps.dist-cache.outputs.cache-hit != 'true'
          && steps.dist-cache.outputs.cache-primary-key != ''
          && steps.docs-fast-path.outputs.docs_only != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-newstyle
          key: ${{ steps.dist-cache.outputs.cache-primary-key }}

  # Path-selective, BLOCKING behavior-probe gate (#530), split from
  # test-and-audits so real-engine probes run in parallel with hspec and the
  # engine-free audits. It is PR-only, preserving the existing policy;
  # master pushes keep test-and-audits as their complete post-merge backstop,
  # with the stable build-test aggregate reporting its verdict.
  behavior-probes:
    if: github.event_name == 'pull_request'
    needs: resolve-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Select before any Cabal or cache work so a change with no eligible
      # probes gets a fast, explicit green check. The output is already a
      # comma-separated, single-line --only value, so it is safe to carry
      # through a normal GitHub Actions output.
      - name: Select behavior probes
        id: probe-selection
        run: |
          BASE='${{ github.event.pull_request.base.sha }}'
          echo "Diffing against base $BASE"
          git fetch --no-tags origin "$BASE"
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "Changed files:"
          printf '%s\n' "$CHANGED" | awk '{print "  " $0}'
          ONLY="$(printf '%s\n' "$CHANGED" | python3 tools/ci_probes.py --stdin)"
          if [ -z "$ONLY" ]; then
            echo "No behavior probes selected for this change — skipping."
            echo "selected=false" >> "$GITHUB_OUTPUT"
          else
            echo "Selected probes: $ONLY"
            echo "selected=true" >> "$GITHUB_OUTPUT"
            echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          fi

      # This PR worker restores exactly the master epoch selected from its
      # base SHA. It never saves project caches.
      - name: Select project build cache epoch
        if: steps.probe-selection.outputs.selected == 'true'
        id: cache-epoch
        run: >-
          python3 tools/ci_cache_epoch.py
          --ref '${{ github.event.pull_request.base.sha }}'
          --github-output "$GITHUB_OUTPUT"
          --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Toolchain (baked into the CI image)
        if: steps.probe-selection.outputs.selected == 'true'
        run: |
          /usr/local/.ghcup/bin/ghc --version
          /usr/local/.ghcup/bin/cabal --version
          echo "/usr/local/.ghcup/bin" >> "$GITHUB_PATH"
          echo "CABAL_DIR=/usr/local/cabal" >> "$GITHUB_ENV"

      # Match test-and-audits' plan resolution so both jobs address the same
      # dependency and dist-newstyle cache entries.
      - name: Resolve dependency plan
        if: steps.probe-selection.outputs.selected == 'true'
        run: |
          cabal build all --dry-run
          cabal update
          cabal build all --dry-run

      - name: Restore dependency cache
        if: steps.probe-selection.outputs.selected == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/cabal/store
          key: deps-v2-${{ runner.os }}-ghc9.12.2-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: deps-v2-${{ runner.os }}-ghc9.12.2-

      - name: Restore project build cache (dist-newstyle)
        if: steps.probe-selection.outputs.selected == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: probe-dist-cache
        with:
          path: dist-newstyle
          key: dist-v3-${{ runner.os }}-${{ needs.resolve-image.outputs.image }}-ghc-9.12.2-cabal-3.16.1.0-${{ hashFiles('dist-newstyle/cache/plan.json') }}-epoch-${{ steps.cache-epoch.outputs.epoch }}
          restore-keys: |
            dist-v3-${{ runner.os }}-${{ needs.resolve-image.outputs.image }}-ghc-9.12.2-cabal-3.16.1.0-${{ hashFiles('dist-newstyle/cache/plan.json') }}-epoch-
            dist-v3-${{ runner.os }}-${{ needs.resolve-image.outputs.image }}-ghc-9.12.2-cabal-3.16.1.0-
            ${{ needs.resolve-image.outputs.image == 'ghcr.io/coghex/synarchy-ci:ci-9eaa6afb33b34025' && format('dist-v2-{0}-ghc-9.12.2-cabal-3.16.1.0-', runner.os) || 'dist-v2-disabled-for-incompatible-image-' }}

      # This runner has its own restored build tree. Besides the executable
      # every probe launches, persistence_contract shells out to
      # `cabal repl test:synarchy-test-headless`; compile that target here so
      # it cannot consume the probe's timeout rebuilding a stale cached suite.
      # This job never saves either cache; test-and-audits remains the sole
      # cache writer for the workflow.
      - name: Build behavior probe prerequisites
        if: steps.probe-selection.outputs.selected == 'true'
        run: cabal build exe:synarchy synarchy-test-headless

      # --jobs 2 pairs probes on the 4-vCPU runner. --retries 1 reruns a
      # failed probe solo, absorbing the contention flakes this concurrency
      # can introduce without weakening the final blocking verdict. If retries
      # start firing regularly, reduce this to --jobs 1 rather than increasing
      # the retry count.
      - name: Behavior probes (path-selective)
        if: steps.probe-selection.outputs.selected == 'true'
        run: >-
          python3 tools/run_probes.py
          --only "${{ steps.probe-selection.outputs.only }}"
          --exact --retries 1 --jobs 2

  # Stable aggregate context consumed by branch protection and the PR
  # drainer. The drainer gates its --admin merge on exactly `build-test`, so
  # this job must fail when either parallel PR worker fails. On master pushes
  # behavior-probes is intentionally skipped and test-and-audits remains the
  # complete post-merge backstop.
  build-test:
    if: always()
    needs:
      - test-and-audits
      - behavior-probes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require parallel CI workers
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTS_RESULT: ${{ needs.test-and-audits.result }}
          PROBES_RESULT: ${{ needs.behavior-probes.result }}
        run: |
          test "$TESTS_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$PROBES_RESULT" = success
          else
            test "$PROBES_RESULT" = skipped
          fi
