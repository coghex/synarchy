      # guard against its own headline failure mode -- a missed
      # `assets/textures/...` reference after a texture move renders
      # MAGENTA in-engine rather than erroring, so nothing fails, it
      # just looks wrong. tools/check_texture_paths.py shipped as that
      # guard in PR #430 and was then run by nothing: neither this
      # workflow, nor tools/ci-local.sh, nor the Makefile or Cabal. A
      # real moved or missing texture merged with it never running.
      # Unconditional rather than path-selective: it costs a fraction of
      # a second, and the reference and the file it names live in
      # different trees, so either side can break the other alone.
      # The self-test runs first: it proves the checker still reports a
      # missing reference of each supported shape, and still lexes
      # comment from code, so a green run below cannot be a checker that
      # had quietly stopped scanning.
      - name: Texture path existence check
        run: |
          python3 tools/test_check_texture_paths.py
          python3 tools/check_texture_paths.py

      # Validate the probe-runner harness itself on every run (cheap, no
      # engine, no GPU). ci_probes/ci_expensive_gates cover the
      # path->probe mapping, which would otherwise only surface as a PR
      # mis-selecting; test_run_probes covers run_probes.py's own
      # process-group teardown (#1323) against synthetic probes and
      # synthetic engine descendants, plus (#1321) --exact rejecting
      # unknown probe keys instead of silently dropping them;
      # test_persistence_contract_sweep covers the companion registry-
      # drift guard that keeps persistence_contract_sweep.py's own
      # cross-probe key list from going stale against that registry
      # (#1321), which nothing else exercises;
      # test_action_outcome_probe covers action_outcome_probe.py's
      # chop-fixture classification (#1398) — setup-vs-behavior failure
      # and the 0/1/2 exit contract — against a fake console, so the
      # branches are checked without the probe's own ~8-minute real
      # engine and 64-world generation, and (#1793) its
      # find_mixed_box anchor filter and 5x5 sweep reading
      # world.getFluidAt through that query's ARITY contract. That
      # probe itself stays manual-only and out of the
      # path-selective gate; only this engine-free companion runs
      # here. test_tillable_fluid_filter is #1793's own: the
      # tillable-tile scans in till_probe, plant_probe and
      # farm_ai_probe decode world.getFluidAt by arity too, so a
      # flat, flora-free tile under water is never returned as
      # tillable. It owns the fake console that reproduces the
      # debug console's tab-joined multi-return — the thing a
      # sloppier test double would paper over — and
      # test_action_outcome_probe imports it rather than
      # re-deriving it, so the two cannot drift. Those three
      # probes each boot a real engine and generate a world; this
      # companion boots nothing. test_probelib pins
      # probelib.send_json's result contract (empty -> None, valid JSON
      # -> value, invalid JSON -> text) against a real socket speaking
      # the console protocol, and fails if a probe grows a private JSON
      # console wrapper again — the twenty-two-copy duplication #1160
      # removed. It also owns probe_engine.py's launcher contract
      # (#1570): under the aggregate runner a probe execs the one
      # already-resolved binary with no Cabal in its argv, while a probe
      # run by hand BUILDS one first (#1913) — inside an exclusive
      # cabal-build hold, owning that build's process group, on its own
      # 1800 s allowance — so the READY deadline that follows measures
      # engine startup and a build that fails is reported as a
      # preparation failure carrying its own output.
      # test_probe_flake mutation-covers probe_protocol.py,
      # probe_flake.py and probe_census.py's parsers from both sides,
      # engine-free and GPU-free, and every #1426 protocol migration
      # extends it with another standalone case, so each of those
      # migrations shipped with a gate nothing ran until #1475.
      # test_probe_census is the census's own self-test — the record,
      # its atomic writer, the declared schema, and #1429's cohort,
      # freshness and staleness semantics — driving synthetic documents
      # in throwaway temporary trees, so it touches no docs worktree and
      # boots nothing. test_probe_claim is #1434's: the atomic per-probe
      # claim, its lease, ownership-safe takeover and release, and the
      # claim-aware orchestration boundary. Its concurrency cases start
      # real interpreters that race on a shared barrier file, and its
      # crash case SIGKILLs one of them, because a claim that has to
      # hold between OS processes cannot be proved by threads. Still
      # engine-free and GPU-free: no probe is ever executed.
      # test_probe_resource_lock is #1436's cross-process reader/writer
      # lock — the half probe_runner_resources' in-process ledger cannot
      # provide —
      # proved with separate interpreters and one SIGKILLed holder,
      # because a lock that has to hold between OS processes cannot be
      # proved by threads either. test_deflake is the /deflake
      # orchestrator: every collaborator is an injected adapter, while
      # probe_census and probe_flake.Measurement themselves are driven
      # for real against throwaway censuses in temporary directories, so
      # the recorder claims it checks are the shipped recorder's. The
      # REAL engine-booting ten-run measurement is deliberately absent
      # from this job and from tools/ci-local.sh — tools/README.md states
      # that a real run is supplemental manual evidence and never a merge
      # gate. test_location_embark_probe is #1569's: the artifact
      # ownership of tools/location_embark_probe.py — one
      # invocation-owned directory, --resource-root on every boot,
      # release on a pass, a phase-0 return, an exception and a boot
