# Review gate: turns the label-based review workflow into a required
# status check, so auto-merge waits for the review verdict as well as
# CI. The formal GitHub review-approval mechanism can't be used here —
# author and reviewer share one account, and GitHub refuses
# self-approval — so the `reviewed:approve` label (already used by
# ntfy-notify.yml) is the verdict, and this check enforces it.
#
# Flow:
#   - PR opened / updated → "review-approved" check FAILS
#     (red = "review verdict pending", merging blocked)
#   - reviewer applies `reviewed:approve`  → check PASSES
#   - a synchronize push that changes this PR's own patch → label
#     auto-removed (stale approvals don't carry a changed PR through;
#     re-approve)
#   - a synchronize push that leaves this PR's own patch byte-identical
#     (a "merge base into head" branch update, e.g. from strict branch
#     protection's up-to-date-with-base requirement being satisfied by
#     a human clicking "Update branch", or equivalent automation, after
#     an unrelated sibling PR merges) → label is KEPT (#801 review, the
#     original review-pr.py flakiness this caused)
name: review-gate

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

jobs:
  # This job name is the required-status-check context.
  review-approved:
    runs-on: ubuntu-latest
    steps:
      - name: Require the reviewed:approve label
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'reviewed:approve') }}" = "true" ]; then
            echo "reviewed:approve present — gate open"
          else
            echo "no reviewed:approve label — review verdict pending"
            exit 1
          fi

  # New commits that change this PR's own patch invalidate a prior
  # approval: strip the label so the gate closes until the reviewer
  # re-approves the updated code. The removal fires an `unlabeled`
  # event, which re-runs review-approved. A synchronize push that leaves
  # this PR's own patch identical -- a base-branch update merged forward
  # with no overlapping content -- leaves the label alone: the reviewed
  # code hasn't actually changed, only the branch's ancestry has, and
  # stripping it anyway causes exactly the kind of race that made
  # review-pr.py report a spurious failure (#801 review).
  #
  # The decision itself lives in tools/review_gate_decision.py (#1679),
  # not inline here, for two reasons. It compares the PR's own PATCH on
  # each side of the push rather than intersecting the push's paths with
  # the PR's post-push file list, because a file reverted to its base
  # content vanishes from that list and so erased the very evidence that
  # it had been approved. And a decision that lives in a tools/ script
  # can be driven by a self-test: tools/review_gate_decision.py
  # --self-test runs in .github/workflows/ci.yml and tools/ci-local.sh,
  # against real throwaway commit graphs, so this job's policy is
  # checked by the same gate set as everything else.
  #
  # Fail-closed all the way out: the script exits non-zero for every
  # case it cannot positively prove is content-free, and a crash, a bad
  # argument or an absent script (a branch that predates #1679) is a
  # non-zero exit too, so the `else` below strips.
  dismiss-stale-approval:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the pushed branch with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Remove reviewed:approve unless this push is a no-op branch update
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The decision needs the BASE BRANCH, to find each side's merge
          # base with it. `fetch-depth: 0` above brings the whole history,
          # but this checkout is pinned to a SHA, so make the base ref's
          # existence explicit rather than depending on the action's
          # refspec. Best effort: if it fails, the decision falls back to
          # the event's own base.sha and, failing that, strips.
          git fetch --no-tags --quiet origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
          if python3 tools/review_gate_decision.py \
               --before "$BEFORE" \
               --after "$AFTER" \
               --base-ref "$BASE_REF" \
               --base-sha "$BASE_SHA"; then
            echo "this PR's own patch is unchanged -- keeping reviewed:approve"
          else
            echo "stripping reviewed:approve"
            # Best effort, exactly as it has always been: the label may
            # already be absent, and failing the job over that would turn
            # a correct strip into a red required check.
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label reviewed:approve || true
          fi
